block.silicon-item-transfer-hub.name=Item Transfer Hub
block.silicon-item-transfer-hub.description=[accent]Zero-buffer logistics hub[] - fully automatic item scheduling across networks; it stocks nothing and never over-ships.\n\n[lightgray]> Links[]\nConnects producers, storages, cores, turrets and other [accent]hubs[] within range (up to 20 links).\n[accent]Place / double-tap[]: 1) link every in-range hub first (nearest first); 2) then link nearby buildings outside those hubs' networks. Buildings already served by another hub are never stolen - green squares mean "eligible but not linked", blue squares + line mean "will be linked". Click a linked target to toggle; double-tap self to clear all.\n\n[lightgray]> Pull - Supply[]\nFeeds factories/turrets with a consumption-matched budget: real usage plus a small buffer only.\nSource order: [accent]storage > core > miner/crafter output[]. Recipe inputs of any building are never taken away.\n\n[lightgray]> Push - Overflow[]\nOutput at 75% gets drained: pushed into any core with real room, otherwise rerouted to the nearest storage. Storage overflow (>=90%) or low core stock (<75%) returns to the core. [orange]A truly full core never receives items - nothing gets incinerated[].\n\n[lightgray]> Power[]\nEach item passing through each hub costs [accent]10 power[]; zero draw when idle. Demand is spread over 30 frames, so no spikes hit the grid. [orange]Underpowered hubs stop completely and cool down[] before retrying; routing automatically avoids dead hubs.\n\n[lightgray]> Stats[]\nPower = actual draw over the last second. Rate = items through this hub over the last 10 seconds. At steady load, power ~ 10 x rate. Cross-hub transfers bill one hop per hub.
