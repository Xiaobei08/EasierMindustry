block.silicon-satellite-console.close=Close
block.silicon-satellite-console.description=3x3 launch terminal: open the panel to check status and launch. Consumes 100 power/s; launch consumes oil (1000-8000 by orbit) and 10000 buffered power from the launch hub; satellite type is picked at the launch hub; signal satellites are limited to LEO/MEO/GEO (SSO is not available to signal satellites); signal and test satellites share the same effect: satellites fly realistic ground-track paths (LEO/MEO scan west-east with wrap-around, SSO scans north-south polar, GEO hovers stationary; tracks fill the whole map over time) and provide signal within their sub-satellite point coverage disc (LEO/MEO/SSO radius scales with the map's short half-axis: 40/60/25 tiles on a 250x250 map; GEO is stationary with map-diagonal coverage — the whole map from one satellite) — strength: 1.5/1.3/1.1 raw each; interference scales by SINR — a signal is receivable only while its power exceeds the noise floor plus interference, and quality rises smoothly with SINR; stacking is logarithmic (strongest at full value, the rest diminishing) — a single satellite still activates relays; the test satellite only costs 1 silicon).
