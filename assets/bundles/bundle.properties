block.silicon-satellite-launcher.name=Satellite Launch Hub
block.silicon-satellite-launcher.description=3x3 satellite production facility: pick a satellite type, then it produces automatically (5000 power/s during production, 60s per signal satellite) consuming 5000 copper, 5000 silicon, 1250 plastanium, 1250 surge alloy and 1000 cryofluid; the test satellite only costs 1 silicon and produces in 1s, with the same effect as the signal satellite (sub-satellite point coverage). Stops consuming power and shows a ready prompt when done. Stores 10000 launch buffer and oil reserve (up to 8000); the actual oil consumed depends on the orbit picked at the console (LEO 1000 to SSO 8000).
