block.silicon-power-protector.name=Power Protector
block.silicon-power-protector.description=When grid power turns negative it automatically switches into protection mode, dynamically fills the grid and records power consumed; once the grid recovers, it must repay 110% of the power consumed.\n\n[accent]Available protection time[]\nStores up to 90s, shared by all protectors.\nAvailable time only slowly recovers after the owed power is fully repaid.\n\n[accent]Cannot be dismantled[]\nCannot be dismantled while it still owes power.\n\n[accent]Warning!\nNot recommended on highly fluctuating grids![]
