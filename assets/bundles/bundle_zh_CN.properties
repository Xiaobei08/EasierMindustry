block.silicon-satellite-launcher.name=卫星发射中枢
block.silicon-satellite-launcher.description=3×3 卫星生产设施：点击选择卫星种类后自动生产（生产耗电 5000/秒，信号卫星 60 秒一颗），生产需消耗铜 5000、硅 5000、塑钢 1250、巨浪合金 1250、冷冻液 1000；测试卫星仅需 1 硅、1 秒生产，效果与信号卫星相同（星下点覆盖）。生产完成后停止耗电并提示可发射。内置 10000 发射缓冲与石油储备（上限 8000），实际发射消耗按卫星控制台所选轨道（LEO 1000~SSO 8000）。
