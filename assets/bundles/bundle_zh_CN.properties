block.silicon-satellite-console.description=3×3 卫星发射终端：点击打开界面查看状态并发射。耗电 100 电力/秒；发射消耗卫星发射中枢的石油（按轨道 1000~8000）与 10000 缓冲电力；卫星种类在发射中枢选择；信号卫星限 LEO/MEO/GEO 轨道（SSO 不对信号卫星开放，供其他卫星类型使用）；信号/测试卫星效果相同——卫星沿拟真星下点轨迹飞行（LEO/MEO 东西向回绕扫描、SSO 南北向极轨扫描、GEO 定点悬停，轨迹随时间铺满全图），在其星下点覆盖圆内提供信号（LEO/MEO/SSO 覆盖半径随图幅短半轴等比缩放，250×250 地图上 40/60/25 格；GEO 定点全图，覆盖半径=地图对角线）——强度：每星原始 1.5/1.3/1.1，干扰按信噪比（SINR）折算——信号功率压过底噪+干扰才可接收，质量随 SINR 平滑升至满值；对数叠星（最强全额、其余递减），首颗即可激活中继器转发；测试卫星仅需 1 硅）。
