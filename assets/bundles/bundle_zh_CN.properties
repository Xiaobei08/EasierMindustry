block.silicon-power-protector.name=电力保护器
block.silicon-power-protector.description=电网电池电量耗尽、供需为负时自动切入[accent]保护模式[]，电池式瞬间补齐电网全部缺口。\n\n[accent]保护模式[]\n按缺口供电并累计消耗；到达保护时长上限（默认 5 分钟）、或电网连续电力增长满 30 秒时退出，转入恢复模式。\n\n[accent]恢复模式[]\n以「等额本金 + 0.1%/s 利息」的速率经临时接入点向电网偿还保护期间累计消耗，还清后自动回到待机。\n\n[accent]冲突与拆除[]\n同一电网仅允许一台保护器。保护/恢复期间无法拆除；与其他保护器冲突时强制停机、可拆除。[]
