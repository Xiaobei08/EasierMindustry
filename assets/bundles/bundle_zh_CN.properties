# —— 物品传输中枢 ——
block.silicon-item-transfer-hub.name=物品传输中枢
block.silicon-item-transfer-hub.description=[accent]零缓冲物流中枢[]——全自动跨网络物品调度；不储存任何物品，绝不超量搬运。\n\n[lightgray]> 连接[]\n自动连接范围内的[accent]矿机、仓库、核心、炮台和其它中枢[]（最多 20 条连接）。\n[accent]放置/双击[]：①优先连接范围内全部中枢（距离就近）；②其次连接中枢网络外的建筑。已被其它中枢服务的建筑不会被抢走——绿色方框＝「可连但未连」，蓝色方框+连线＝「将连接」。点击已连目标可切换；双击自身清空全部连接。\n\n[lightgray]> 拉取-补货[]\n按消耗量匹配预算为工厂/炮台补货：仅补充真实消耗量加少量缓冲。\n供源优先级：[accent]仓库 > 核心 > 矿机/工厂产出[]。绝不抽取任何工厂配方输入料。\n\n[lightgray]> 推送-溢出[]\n产出达 75% 时排空：优先推入有空间的核心，否则转运至最近仓库。仓库溢出（≥90%）或核心存量低（<75%）时回运核心。[orange]已满核心绝不接收物品——不会焚烧丢弃[]。\n\n[lightgray]> 电力[]\n每件物品经手中枢消耗 [accent]10 电力[]；空闲时零耗电。需求分摊到 30 帧内，电网无尖峰。[orange]电力不足的中枢完全停转并冷却[]，之后重试；路由自动避开停转中枢。\n\n[lightgray]> 统计[]\n电力 = 最近 1 秒实际取电。速率 = 最近 10 秒通过本枢的件数。稳态下 电力 ≈ 10 × 速率。跨枢中转每枢各计一跳。
