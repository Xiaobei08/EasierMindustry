block.silicon-petroleum-refinery.description=将原油与氢气炼制成润滑油与火石。\n\n[b]配方（每秒）：[]25 石油 + 50 氢气 → 10 润滑油 + 0.2 火石（周期 5s，功耗 240/s）。\n\n[accent]产物排出[]\n产物存入内部库存，仅向己方建筑排出，防止敌方传送带/管道旁路取走。\n\n[accent]输入保护[]\n只接受己方供给的原料液体，避免敌方灌入干扰生产。[]

